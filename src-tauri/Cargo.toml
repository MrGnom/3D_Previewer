[package]
name = "babylon-viewer"
version = "0.1.0"
description = "Desktop 3D model viewer built on Babylon.js"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
percent-encoding = "2"
